<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CRACKA NIDS⚡</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* Main app jaisa gradient mesh background */
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
    }

    .auth-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 550px;
      /* Proper Glassmorphism */
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .auth-left {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-right {
      flex: 1;
      /* Glassy gradient for the side panel */
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(129, 140, 248, 0.8) 100%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      /* Glassy inputs */
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.6);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-outline {
      padding: 10px 24px;
      background: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .btn-outline:hover {
      background: white;
      color: var(--primary);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 768px) {
      .auth-wrapper {
        flex-direction: column;
        height: auto;
        margin: 20px;
      }
      .auth-right {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <!-- Login Form Area -->
    <div class="auth-left">
      <div class="brand-title">Welcome Back</div>
      <div class="brand-subtitle">Enter your credentials to access your dashboard.</div>
      
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required placeholder="Enter username">
        </div>

        <div class="form-group" style="margin-bottom: 30px;">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>
    </div>

    <!-- Side Panel -->
    <div class="auth-right">
      <h2 style="font-size: 2.5rem; margin-bottom: 10px;">🛡️ CRACKA NIDS</h2>
      <p style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; max-width: 250px;">
        Advanced Network Intrusion Detection System
      </p>
      <p style="margin-bottom: 15px;">New to the platform?</p>
      <a href="/register" class="btn-outline">Create an Account</a>
    </div>
  </div>

</body>
</html>
