<!-- Jinja2 Macro define kar rahe hain jisme 'name' parameter pass hoga -->
{% macro icon(name) -%}
<!-- Base SVG tag jisme stroke aur viewbox set hai -->
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'shield' %}
  <!-- Shield icon ka path (Logo ke liye use hua hai) -->
  <path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'dashboard' %}
  <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'live' %}
  <path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1.5"/><path d="M12 14v6"/>
{%- elif name == 'manual' %}
  <path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/>
{%- elif name == 'history' %}
  <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/>
{%- elif name == 'model' %}
  <circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6l8 6M8 18l8-6"/>
{%- elif name == 'overview' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>
{%- elif name == 'menu' %}
  <path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'moon' %}
  <!-- Dark theme icon -->
  <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
{%- elif name == 'sun' %}
  <!-- Light theme icon -->
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>
{%- elif name == 'upload' %}
  <!-- CSV upload dropzone ka icon -->
  <path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- endif %}
</svg>
{%- endmacro %}
