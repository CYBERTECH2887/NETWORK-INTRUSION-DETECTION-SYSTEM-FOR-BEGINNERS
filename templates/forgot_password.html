<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CRACKA NIDS⚡</title>
  <style>
    :root {
        --bg-dark: #09090b;
        --bg-panel: rgba(24, 24, 27, 0.6);
        --primary: #8b5cf6; 
        --primary-hover: #7c3aed;
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --border: rgba(139, 92, 246, 0.2);
        --input-bg: rgba(24, 24, 27, 0.7);
        --mesh-1: rgba(139, 92, 246, 0.15);
        --mesh-2: rgba(14, 165, 233, 0.15);
    }
    [data-theme="light"] {
        --bg-dark: #fff7ed;
        --bg-panel: rgba(255, 255, 255, 0.7);
        --primary: #ea580c; /* Orange */
        --primary-hover: #c2410c;
        --text: #0f172a;
        --text-muted: #475569;
        --border: rgba(234, 88, 12, 0.3);
        --input-bg: rgba(255, 255, 255, 0.8);
        --mesh-1: rgba(234, 88, 12, 0.15);
        --mesh-2: rgba(79, 70, 229, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-dark); background-image: radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 50%), radial-gradient(at 100% 100%, var(--mesh-2) 0px, transparent 50%); background-attachment: fixed; color: var(--text); }
    
    .auth-wrapper { width: 100%; max-width: 450px; padding: 40px; background: var(--bg-panel); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .brand-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .brand-subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; text-align: center; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
    .form-control:focus { border-color: var(--primary); }
    
    .password-container { position: relative; display: flex; align-items: center; }
    .password-container .form-control { padding-right: 40px; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; }
    .toggle-password:hover { color: var(--primary); }

    .btn-primary { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
    .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="brand-title">Reset Password 🔒</div>
    <div class="brand-subtitle">Verify your identity to create a new password.</div>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="POST" action="/forgot_password">
      <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required placeholder="Enter your username"></div>
      <div class="form-group"><label>Registered Email</label><input type="email" name="email" class="form-control" required placeholder="Enter your email"></div>
      <div class="form-group">
        <label>New Password</label>
        <div class="password-container">
          <input type="password" name="new_password" id="new-password" class="form-control" required placeholder="Create new password">
          <span class="toggle-password" onclick="toggleVisibility('new-password', this)">Show</span>
        </div>
      </div>
      <button type="submit" class="btn-primary">Update Password</button>
    </form>
    <a href="/login" class="back-link">← Back to Login</a>
  </div>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.textContent = input.type === 'password' ? 'Show' : 'Hide'; 
    }
  </script>
</body>
</html>
