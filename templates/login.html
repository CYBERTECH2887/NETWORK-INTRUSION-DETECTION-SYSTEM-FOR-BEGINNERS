<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CRACKA NIDS⚡</title>
  <style>
    :root {
        --bg-dark: #09090b;
        --bg-panel: rgba(24, 24, 27, 0.6);
        --primary: #8b5cf6; 
        --primary-hover: #7c3aed;
        --accent: #38bdf8;
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --border: rgba(139, 92, 246, 0.2);
        --input-bg: rgba(24, 24, 27, 0.7);
        --mesh-1: rgba(139, 92, 246, 0.15);
        --mesh-2: rgba(14, 165, 233, 0.15);
    }
    [data-theme="light"] {
        --bg-dark: #fff7ed;
        --bg-panel: rgba(255, 255, 255, 0.7);
        --primary: #ea580c; /* Orange */
        --primary-hover: #c2410c;
        --accent: #4f46e5;
        --text: #0f172a;
        --text-muted: #475569;
        --border: rgba(234, 88, 12, 0.3);
        --input-bg: rgba(255, 255, 255, 0.8);
        --mesh-1: rgba(234, 88, 12, 0.15);
        --mesh-2: rgba(79, 70, 229, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-dark); background-image: radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 50%), radial-gradient(at 100% 100%, var(--mesh-2) 0px, transparent 50%); background-attachment: fixed; color: var(--text); }
    
    .auth-wrapper { display: flex; width: 100%; max-width: 900px; height: 550px; background: var(--bg-panel); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; }
    .auth-left { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    .auth-right { flex: 1; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; }
    
    .brand-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .brand-subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
    .form-control:focus { border-color: var(--primary); }
    
    .password-container { position: relative; display: flex; align-items: center; }
    .password-container .form-control { padding-right: 40px; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; }
    .toggle-password:hover { color: var(--primary); }
    
    .btn-primary { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
    
    .btn-outline { padding: 10px 24px; background: transparent; color: white; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; margin-top: 20px; }
    .btn-outline:hover { background: white; color: var(--primary); }
    
    .msg-box { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
    .msg-box.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; }
    .msg-box.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.5); color: #10b981; }

    @media (max-width: 768px) { .auth-wrapper { flex-direction: column; height: auto; margin: 20px; } .auth-right { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-left">
      <div class="brand-title">Welcome Back</div>
      <div class="brand-subtitle">Enter your credentials to access your dashboard.</div>
      {% if error %}<div class="msg-box error">{{ error }}</div>{% endif %}
      {% if success %}<div class="msg-box success">{{ success }}</div>{% endif %}
      <form method="POST" action="/login">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required placeholder="Enter username">
        </div>
        <div class="form-group" style="margin-bottom: 30px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin-bottom: 0;">Password</label>
            <a href="/forgot_password" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Forgot Password?</a>
          </div>
          <div class="password-container">
            <input type="password" name="password" id="login-password" class="form-control" required placeholder="Enter password">
            <span class="toggle-password" onclick="toggleVisibility('login-password', this)">Show</span>
          </div>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
    </div>
    <div class="auth-right">
      <h2 style="font-size: 2.5rem; margin-bottom: 10px;">🛡️ CRACKA NIDS</h2>
      <p style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; max-width: 250px;">Advanced Network Intrusion Detection System</p>
      <p style="margin-bottom: 15px;">New to the platform?</p>
      <a href="/register" class="btn-outline">Create an Account</a>
    </div>
  </div>
  <script>
    // Apply Theme from localStorage
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function toggleVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.textContent = input.type === 'password' ? 'Show' : 'Hide'; 
    }
  </script>
</body>
</html>
