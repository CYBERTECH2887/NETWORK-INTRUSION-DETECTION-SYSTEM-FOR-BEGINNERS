<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CRACKA NIDS⚡</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* Main app jaisa gradient mesh background */
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 20px;
    }

    .auth-wrapper {
      display: flex;
      flex-direction: row-reverse;
      width: 100%;
      max-width: 1000px;
      /* Proper Glassmorphism */
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .auth-left {
      flex: 1.5;
      padding: 40px;
    }

    .auth-right {
      flex: 1;
      /* Glassy gradient for the side panel */
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(129, 140, 248, 0.8) 100%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      /* Glassy inputs */
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.6);
    }
    
    select.form-control option {
      background-color: #0f172a;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-outline {
      padding: 10px 24px;
      background: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .btn-outline:hover {
      background: white;
      color: var(--primary);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 15px;
      text-align: center;
      grid-column: span 2;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 768px) {
      .auth-wrapper {
        flex-direction: column;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full-width {
        grid-column: span 1;
      }
      .auth-right {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <!-- Registration Form Area -->
    <div class="auth-left">
      <div class="brand-title">Create Account</div>
      <div class="brand-subtitle">Fill in your details to get started.</div>
      
      <form method="POST" action="/register" class="form-grid">
        {% if error %}
          <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div class="form-group full-width">
          <label>Full Name</label>
          <input type="text" name="fullname" class="form-control" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required placeholder="johndoe123">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" class="form-control" required placeholder="+91 0000000000">
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="dob" class="form-control" required>
        </div>

        <div class="form-group">
          <label>Profession</label>
          <input type="text" name="profession" class="form-control" required placeholder="Student, Engineer, etc.">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select name="gender" class="form-control" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Create a strong password">
        </div>

        <div class="form-group full-width">
          <button type="submit" class="btn-primary">Sign Up</button>
        </div>
      </form>
    </div>

    <!-- Side Panel -->
    <div class="auth-right">
      <h2 style="font-size: 2.2rem; margin-bottom: 10px;">🛡️ CRACKA</h2>
      <p style="font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; max-width: 250px;">
        Join us to secure your networks intelligently.
      </p>
      <p style="margin-bottom: 15px;">Already have an account?</p>
      <a href="/login" class="btn-outline">Log In</a>
    </div>
  </div>

</body>
</html>
