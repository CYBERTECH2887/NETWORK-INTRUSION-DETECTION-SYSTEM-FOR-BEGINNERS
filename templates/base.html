<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRACKA NIDS</title>
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    /* Styling for functional elements and emojis */
    .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: rgba(16, 185, 129, 0.1);
        color: #10b981;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .profile-dropdown {
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .profile-dropdown:hover {
        opacity: 0.8;
    }
    .nav-icon {
        font-size: 1.2rem;
        width: 30px;
        text-align: center;
        display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Navigation Sidebar -->
  <aside class="sidebar" id="main-sidebar">
    <div class="brand" style="display: flex; align-items: center; margin-bottom: 30px;">
      <span style="font-size: 1.8rem; margin-right: 10px;">🛡️</span>
      <span style="font-weight: 800; letter-spacing: 1px;">CRACKA NIDS</span>
    </div>
    
    <a href="/overview" class="nav-link {% if request.path == '/overview' or request.path == '/' %}active{% endif %}">
      <span class="nav-icon">🏠</span>
      <span>Project Overview</span>
    </a>
    <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span>
      <span>Dashboard Analytics</span>
    </a>
    <a href="/manual_prediction" class="nav-link {% if request.path == '/manual_prediction' %}active{% endif %}">
      <span class="nav-icon">⌨️</span>
      <span>Manual Prediction</span>
    </a>
    <a href="/live_prediction" class="nav-link {% if request.path == '/live_prediction' %}active{% endif %}">
      <span class="nav-icon">📡</span>
      <span>Upload CSV / Live</span>
    </a>
    <a href="/model_description" class="nav-link {% if request.path == '/model_description' %}active{% endif %}">
      <span class="nav-icon">🧠</span>
      <span>Model Architecture</span>
    </a>
  </aside>

  <!-- Main Container -->
  <div class="main-wrapper">
    <header class="top-navbar">
      <div style="display: flex; align-items: center; gap: 15px;">
        <span id="sidebar-toggle" style="font-size: 1.5rem; cursor: pointer; color: var(--text-main); user-select: none;">☰</span>
        
        <!-- System Status Indicator -->
        <div class="status-badge">
            <span style="font-size: 1rem;">✅</span>
            System Online
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 25px;">
        <div class="theme-toggle-container">
          <span style="font-size: 1.2rem;">☀️</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
          </label>
          <span style="font-size: 1.2rem;">🌙</span>
        </div>
        
        <!-- Functional Profile Avatar -->
        <div class="profile-avatar profile-dropdown" title="Admin Settings">
          <span style="font-size: 1.6rem;">⚡</span>
        </div>
      </div>
    </header>

    <main class="content-area">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/main.js"></script>
  
  <!-- Sidebar Toggle Logic -->
  <script>
      document.getElementById('sidebar-toggle').addEventListener('click', function() {
          const sidebar = document.getElementById('main-sidebar');
          if (sidebar.style.display === 'none') {
              sidebar.style.display = 'flex';
          } else {
              sidebar.style.display = 'none';
          }
      });
  </script>
  
  {% block scripts %}{% endblock %}
</body>
</html>
